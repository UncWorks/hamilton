# Mosquitto config — Hamilton single-laptop demo
# No auth (single signed-in operator per FRS §6 / NFR scope)
# WebSocket listener for the browser MQTT client

persistence false
allow_anonymous true

listener 1883
protocol mqtt

listener 9001
protocol websockets

# Limit message size to keep payloads small (trust score is ~200 bytes)
message_size_limit 8192

# Connection log only at error level — keeps the demo terminal clean
log_dest stdout
log_type error
log_type warning
log_type notice
