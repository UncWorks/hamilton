[project]
name = "hamilton-comms-sim"
version = "0.1.0"
description = "Hamilton comms simulator — Avdiivka counterfactual scenario"
requires-python = ">=3.11"
dependencies = [
    "paho-mqtt>=2.1.0",
    "numpy>=2.1.0",
    "pydantic>=2.9.0",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
comms-sim = "comms_sim.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = true
python_version = "3.11"
