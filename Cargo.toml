[workspace]
resolver = "2"
members = [
    "packages/contracts-rs",
    "services/trust-engine",
    "services/trust-engine/crates/detectors",
    "services/trust-engine/crates/aggregator",
    "services/trust-engine/crates/library",
    "services/trust-engine/crates/transport",
    "services/trust-engine/crates/server",
    "services/trust-engine/crates/estimator",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rumqttc = "0.24"
duckdb = { version = "1.0", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hamilton-contracts = { path = "packages/contracts-rs" }
trust-detectors = { path = "services/trust-engine/crates/detectors" }
trust-aggregator = { path = "services/trust-engine/crates/aggregator" }
trust-library = { path = "services/trust-engine/crates/library" }
trust-transport = { path = "services/trust-engine/crates/transport" }
trust-server = { path = "services/trust-engine/crates/server" }
trust-estimator = { path = "services/trust-engine/crates/estimator" }
